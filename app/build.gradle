plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.kapt'
}

/*
 * ONE committed signing key for every build, local or CI, debug and release.
 *
 * Why: GitHub runners (and every fresh dev machine) generate a *random*
 * debug.keystore, so two APKs built at different times are signed differently
 * and Android refuses to update one over the other ("App not installed").
 * Signing everything with keystore/hotspot-billing.p12 makes every future
 * build install as a normal update over any earlier one - no uninstall dance.
 *
 * Trade-off: anyone who can read this repo can sign APKs Android will accept
 * as updates of this app. Acceptable for a personal hotspot controller; if
 * this is ever distributed publicly, move the key to CI secrets instead.
 */
def sharedKeystore = rootProject.file('keystore/hotspot-billing.p12')
if (!sharedKeystore.exists()) {
    throw new GradleException(
        "Shared signing keystore missing: ${sharedKeystore}\n" +
        "It is committed at keystore/hotspot-billing.p12 - restore it with\n" +
        "'git checkout -- keystore' or see README.md (Updating the app).")
}

// Resolved eagerly and explicitly: `versionCode (x) as int` parses in Groovy as
// `(versionCode(x)) as int`, i.e. it calls the setter with a String and then
// casts the void return - which fails at configuration time.
def resolvedVersionCode = Integer.parseInt((project.findProperty('appVersionCode') ?: '2').toString())
def resolvedVersionName = (project.findProperty('appVersionName') ?: '1.1').toString()

android {
    namespace 'com.hotspot.billing'
    compileSdk 34

    defaultConfig {
        applicationId 'com.hotspot.billing'
        minSdk 26
        targetSdk 34
        versionCode = resolvedVersionCode
        versionName = resolvedVersionName
    }

    signingConfigs {
        shared {
            storeFile = sharedKeystore
            storeType = 'PKCS12'
            storePassword = 'rns-hotspot-billing'
            keyAlias = 'rns-hotspot'
            keyPassword = 'rns-hotspot-billing'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.shared
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.shared
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    lint {
        // Report, don't fail the build - CI uploads the lint report as an artifact.
        abortOnError false
        warningsAsErrors false
        checkReleaseBuilds false
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

/*
 * scripts/ is the single source of truth for the root shell layer; the copies
 * under src/main/assets are generated here so the two can never drift. Plain
 * file IO rather than a Copy spec - two small files, nothing to mis-configure.
 */
def scriptSrc = rootProject.file('scripts')
def scriptDst = file('src/main/assets')
def scriptNames = ['setup_network.sh', 'bandwidth_control.sh']

tasks.register('syncShellScripts') {
    group = 'build'
    description = 'Copies the two root shell scripts into src/main/assets (generated, git-ignored).'
    doLast {
        scriptDst.mkdirs()
        scriptNames.each { name ->
            new File(scriptSrc, name).withInputStream { input ->
                new File(scriptDst, name).withOutputStream { output -> output << input }
            }
        }
    }
}

tasks.matching { it.name == 'preBuild' || (it.name.startsWith('merge') && it.name.endsWith('Assets')) }
    .configureEach { dependsOn 'syncShellScripts' }

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // Root shell execution
    implementation 'com.github.topjohnwu.libsu:core:5.2.1'

    // Local embedded HTTP server for the captive portal
    implementation 'org.nanohttpd:nanohttpd:2.3.1'

    // Room (local DB for vouchers/sessions)
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    kapt 'androidx.room:room-compiler:2.6.1'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // Background sweep of expired vouchers
    implementation 'androidx.work:work-runtime-ktx:2.9.0'

    testImplementation 'junit:junit:4.13.2'
}
