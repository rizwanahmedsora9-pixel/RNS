pluginManagement {
    repositories {
        google {
            content {
                includeGroupByRegex 'com\\.android.*'
                includeGroupByRegex 'com\\.google.*'
                includeGroupByRegex 'androidx.*'
            }
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        mavenCentral()
        // libsu (com.github.topjohnwu.libsu:core) is published on JitPack, not Maven Central.
        maven { url 'https://jitpack.io' }
    }
}

rootProject.name = 'hotspot-billing'
include ':app'
