name: APK

# Builds an installable APK for every pull request and every push to main,
# uploads it as a workflow artifact, and posts the download link back on the PR.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  actions: read

concurrency:
  group: apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  ANDROID_PLATFORM: '34'
  ANDROID_BUILD_TOOLS: '34.0.0'

jobs:
  shell-selftest:
    name: Root shell layer self-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run the firewall / shaper self-test
        run: bash tools/run-script-selftest.sh

  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: shell-selftest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # The GitHub runner images ship the Android SDK; use it rather than
      # re-downloading a second copy of the command-line tools.
      - name: Locate Android SDK and record toolchain
        run: |
          set -Eeuo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK root: $SDK"
          if command -v sdkmanager > /dev/null 2>&1; then
            SM="$(command -v sdkmanager)"
          elif [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          else
            echo "::error::no sdkmanager found (looked on PATH and in $SDK/cmdline-tools/latest/bin)"
            find "$SDK" -maxdepth 3 -type d 2>/dev/null | head -80
            exit 1
          fi
          echo "SDKMANAGER_BIN=$SM" >> "$GITHUB_ENV"
          {
            echo '=== toolchain ==='
            date -u
            uname -a
            java -version
            "$SM" --version || true
            ./gradlew --version || true
            echo '=== sdk packages ==='
            "$SM" --list_installed || true
          } 2>&1 | tee toolchain.txt

      - name: Install the Android platform this project compiles against
        run: |
          set -euo pipefail
          yes | "$SDKMANAGER_BIN" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER_BIN" --install \
            "platforms;android-${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "platform-tools"

      - name: Set up Gradle build cache
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Check shell scripts sync into assets
        run: |
          set -euo pipefail
          rm -f app/src/main/assets/*.sh
          ./gradlew --no-daemon --console=plain --stacktrace :app:syncShellScripts 2>&1 | tee -a gradle.log
          # The Gradle task alone must produce byte-identical copies, otherwise the
          # scripts the app ships can drift from scripts/ (they are git-ignored).
          for f in scripts/*.sh; do
            cmp "$f" "app/src/main/assets/$(basename "$f")"
          done
          ls -l app/src/main/assets

      - name: Unit tests
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --console=plain --stacktrace testDebugUnitTest 2>&1 | tee -a gradle.log

      - name: Lint
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --console=plain lintDebug 2>&1 | tee -a gradle.log

      - name: Build debug and release APKs
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --console=plain --stacktrace \
            assembleDebug assembleRelease \
            -PappVersionCode="${GITHUB_RUN_NUMBER}" \
            -PappVersionName="1.0.${GITHUB_RUN_NUMBER}+${GITHUB_SHA::7}" 2>&1 | tee -a gradle.log

      - name: Collect APKs
        id: collect
        run: |
          set -euo pipefail
          mkdir -p dist
          SHORT="${GITHUB_SHA::7}"
          # Both APKs are signed with the committed keystore (keystore/hotspot-billing.p12),
          # so either one installs as a normal update over any earlier build.
          cp app/build/outputs/apk/debug/app-debug.apk "dist/hotspot-billing-${SHORT}-debug.apk"
          cp app/build/outputs/apk/release/app-release.apk "dist/hotspot-billing-${SHORT}-release.apk"
          {
            echo "version=1.0.${GITHUB_RUN_NUMBER}+${SHORT}"
          } >> "$GITHUB_OUTPUT"
          ls -lh dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: hotspot-billing-apk-${{ github.run_number }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      # Always keep enough information to diagnose failures, including failures
      # before an APK exists. This prevents the old "failed, but no useful log"
      # situation: Gradle output, test XML/HTML, lint, SDK inventory and runner
      # tool versions travel together in one artifact.
      - name: Collect diagnostics and toolchain inventory
        if: always()
        run: |
          set +e
          mkdir -p diagnostics
          cp -f toolchain.txt diagnostics/ 2>/dev/null || true
          cp -f gradle.log diagnostics/ 2>/dev/null || true
          env | sort > diagnostics/environment.txt
          git status --short > diagnostics/git-status.txt
          find app/build -maxdepth 5 -type f \( -name '*.xml' -o -name '*.html' -o -name '*.txt' -o -name '*.json' \) -print > diagnostics/build-files.txt 2>/dev/null || true
          find app/build/reports app/build/test-results -type f -maxdepth 8 -print 2>/dev/null | while read -r f; do
            mkdir -p "diagnostics/$(dirname "$f" | sed 's#^app/build/##')"
            cp -f "$f" "diagnostics/$(dirname "$f" | sed 's#^app/build/##')/" 2>/dev/null || true
          done
          {
            echo '=== failure summary ==='
            grep -RInE 'FAILURE|What went wrong|^e: |error:|FAILED|Exception|Caused by:' diagnostics app/build 2>/dev/null | tail -200 || true
          } > diagnostics/failure-summary.txt

      - name: Upload complete build diagnostics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: apk-diagnostics-${{ github.run_number }}
          path: |
            diagnostics/**
            gradle.log
            toolchain.txt
            app/build/reports/**
            app/build/test-results/**
          if-no-files-found: warn
          retention-days: 30

      # Runner log storage is not always reachable from restricted networks, so
      # mirror the interesting failure lines into the run annotations as well.
      - name: Surface build failures as annotations
        if: failure()
        run: |
          set +e
          echo "::error::APK build failed - diagnostics below (job log may be unreachable)"
          echo "::error::assets dir: $(ls app/src/main/assets 2>&1 | tr '\n' ' ')"
          if [ -s gradle.log ]; then
            grep -E "FAILURE|What went wrong|^e: |error:|Caused by:|Could not|not found|Task .* FAILED|Exception" gradle.log \
              | sed 's/^[[:space:]]*//' | sort -u | tail -n 8 \
              | while IFS= read -r line; do echo "::error::${line}"; done
          else
            echo "::error::no gradle.log produced - the failure happened before Gradle ran"
          fi

      - name: Post build result on the pull request
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v8
        env:
          APK_VERSION: ${{ steps.collect.outputs.version }}
        with:
        script: |
          const fs = require('fs');
          const marker = '<!-- apk-build-result -->';
          const ok = '${{ job.status }}' === 'success';
          const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

          let tail = '';
          let errors = '';
          if (!ok) {
            try {
              const log = fs.readFileSync('gradle.log', 'utf8');
              tail = log.slice(-6000);
              // The `e: file.kt:line:col:` lines are the actual cause; the raw
              // tail is usually just Gradle's internal stack trace. Post both.
              const errLines = log
                .split('\n')
                .filter((l) => /^e: |error:|FAILURE|What went wrong|Caused by:|> Task .* FAILED/.test(l.trim()))
                .slice(0, 60)
                .join('\n');
              if (errLines) {
                errors = '### Compile / test errors\n\n```\n' + errLines + '\n```\n\n';
              }
            } catch (e) {
              tail = `(no gradle.log: ${e.message})`;
            }
          }

            const body = [
              marker,
              `### APK ${ok ? '✅ built' : '❌ failed'}`,
              '',
              '| | |',
              '|---|---|',
              `| Commit | \`${context.sha.slice(0, 7)}\` |`,
              `| Version | \`${process.env.APK_VERSION || 'n/a'}\` |`,
              `| Artifact | \`hotspot-billing-apk-${context.runNumber}\` |`,
              `| Build log | [Actions run #${context.runNumber}](${runUrl}) |`,
              '',
            ok
              ? 'Download from the **Artifacts** section at the bottom of the build log page.'
              : [errors, 'The build did not finish. Gradle output tail:', '', '```', tail, '```'].join('\n'),
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((c) => (c.body || '').includes(marker));
            const payload = { owner: context.repo.owner, repo: context.repo.repo, body };
            if (existing) {
              await github.rest.issues.updateComment({ ...payload, comment_id: existing.id });
            } else {
              await github.rest.issues.createComment({ ...payload, issue_number: context.issue.number });
            }
